<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="blk" width="96" height="44" patternUnits="userSpaceOnUse">
      <rect width="96" height="44" fill="#EDF0F4"/>
      <path d="M0 21.5H96M0 43.5H96M48 0V22M0 22V44M96 22V44" stroke="#DCE2E9" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="cur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F6FAD"/>
      <stop offset="1" stop-color="#245C93"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7E9F7"/>
      <stop offset="1" stop-color="#A9CAE4"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9D1D9"/>
      <stop offset=".5" stop-color="#E8ECF0"/>
      <stop offset="1" stop-color="#B3BDC7"/>
    </linearGradient>
    <pattern id="haz" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="20" fill="#1A1F26"/><rect width="10" height="20" fill="#F5B700"/>
    </pattern>
  </defs>
  <rect width="720" height="520" fill="url(#blk)"/>
  <!-- floor -->
  <rect y="470" width="720" height="50" fill="#CAD2DB"/>
  <path d="M0 470.5H720" stroke="#9AA6B2" stroke-width="2"/>
  <path d="M0 492H720" stroke="#BCC5CF" stroke-width="1"/>
  <!-- opening -->
  <rect x="166" y="112" width="388" height="358" fill="#28313C"/>
  <!-- curtain -->
  <rect x="176" y="118" width="368" height="334" fill="url(#cur)"/>
  <g stroke="#1C4E80" stroke-width="6">
    <path d="M176 186H544M176 296H544M176 366H544M176 424H544"/>
  </g>
  <g stroke="#3B7DBB" stroke-width="1.5" opacity=".6">
    <path d="M176 190H544M176 300H544M176 370H544M176 428H544"/>
  </g>
  <!-- vision window -->
  <rect x="176" y="206" width="368" height="64" fill="url(#glass)"/>
  <path d="M206 270L252 206M236 270L282 206M420 270L466 206" stroke="#fff" stroke-width="5" opacity=".45"/>
  <rect x="176" y="206" width="368" height="64" fill="none" stroke="#1C4E80" stroke-width="3"/>
  <!-- bottom edge -->
  <rect x="176" y="452" width="368" height="18" fill="url(#haz)"/>
  <rect x="176" y="452" width="368" height="18" fill="none" stroke="#11161C" stroke-width="2"/>
  <!-- side guides -->
  <rect x="148" y="108" width="28" height="362" fill="url(#alu)" stroke="#8D99A6" stroke-width="1.5"/>
  <rect x="544" y="108" width="28" height="362" fill="url(#alu)" stroke="#8D99A6" stroke-width="1.5"/>
  <path d="M162 116V462M558 116V462" stroke="#9AA6B3" stroke-width="2" stroke-dasharray="2 6"/>
  <!-- photo eye -->
  <path d="M176 431H544" stroke="#E5482F" stroke-width="2.5" stroke-dasharray="7 6" opacity=".9"/>
  <rect x="547" y="418" width="22" height="26" rx="4" fill="#F5B700" stroke="#8F6400" stroke-width="1.5"/>
  <circle cx="552" cy="431" r="3.5" fill="#1A1F26"/>
  <rect x="151" y="418" width="22" height="26" rx="4" fill="#F5B700" stroke="#8F6400" stroke-width="1.5"/>
  <!-- header box -->
  <rect x="132" y="50" width="456" height="66" rx="9" fill="#0E2236"/>
  <rect x="132" y="50" width="456" height="12" rx="6" fill="#1F4468"/>
  <text x="360" y="94" text-anchor="middle" fill="#F5B700" font-weight="700" font-size="17" letter-spacing="5">GOFF’S</text>
  <!-- conduit + control panel -->
  <path d="M647 236V83H588" stroke="#8D99A6" stroke-width="5" fill="none" stroke-linejoin="round"/>
  <rect x="612" y="232" width="72" height="112" rx="7" fill="#DDE3EA" stroke="#7F8C99" stroke-width="2"/>
  <rect x="622" y="244" width="52" height="38" rx="3" fill="#0E2236"/>
  <path d="M629 256H667M629 264H657M629 272H662" stroke="#5FD39A" stroke-width="2.5"/>
  <circle cx="636" cy="304" r="8" fill="#157F4F"/>
  <circle cx="660" cy="304" r="8" fill="#C0402E"/>
  <rect x="628" y="322" width="40" height="8" rx="2" fill="#B0BAC5"/>
  <!-- floor shadow -->
  <ellipse cx="360" cy="474" rx="210" ry="4" fill="#000" opacity=".08"/>
</svg>
